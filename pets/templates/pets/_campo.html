{# Um campo do formulário com rótulo, erros e ajuda. Espera a variável campo. #}
<label for="{{ campo.id_for_label }}" class="form-label">
  {{ campo.label }}{% if campo.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
</label>
{{ campo }}
{% if campo.errors %}
  <div class="text-danger small mt-1">{{ campo.errors|join:" " }}</div>
{% elif campo.help_text %}
  <div class="form-text">{{ campo.help_text }}</div>
{% endif %}
